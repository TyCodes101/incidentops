name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python -m alembic upgrade head
      - run: docker build -t incidentops-api .
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: docker build -t incidentops-web .

  postgres-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: incidentops-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PASSWORD: synthetic-ci-only-password
      APP_ENV: development
      APP_ORIGIN: http://localhost:8080
      TEST_DATABASE_URL: postgresql+psycopg://incidentops:synthetic-ci-only-password@127.0.0.1:5432/incidentops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,browser]'
      - name: Build and start a fresh PostgreSQL stack
        run: docker compose -f compose.yaml -f compose.test.yaml up --build --wait --wait-timeout 180
      - name: Verify migration revision and explicit synthetic seed
        run: |
          docker compose exec -T api python -m alembic current
          docker compose exec -T api python -m incidentops.manage demo
      - name: Run existing API suite against isolated PostgreSQL schemas
        run: python -m pytest -q
      - name: Exercise the actual HTTP stack
        run: python scripts/compose_smoke.py before
      - name: Restart containers and prove persistence
        run: |
          docker compose restart db
          docker compose -f compose.yaml -f compose.test.yaml up --wait --wait-timeout 180
          docker compose restart api web
          python scripts/compose_smoke.py after
      - name: Exercise database backup and restoration into a separate database
        run: |
          docker compose exec -T db pg_dump -U incidentops -d incidentops -Fc -f /tmp/incidentops.dump
          docker compose exec -T db createdb -U incidentops incidentops_restore_test
          docker compose exec -T db pg_restore -U incidentops --no-owner -d incidentops_restore_test /tmp/incidentops.dump
          original=$(docker compose exec -T db psql -U incidentops -d incidentops -Atc 'SELECT count(*) FROM incidents')
          restored=$(docker compose exec -T db psql -U incidentops -d incidentops_restore_test -Atc 'SELECT count(*) FROM incidents')
          test "$original" = "$restored"
          docker compose exec -T db psql -U incidentops -d incidentops_restore_test -Atc 'SELECT version_num FROM alembic_version'
      - name: Browser walkthrough of the container-served frontend
        env:
          INCIDENTOPS_URL: http://localhost:8080
        run: |
          python -m playwright install --with-deps chromium
          python tests/browser_smoke.py
      - name: Retain container logs
        if: always()
        run: |
          mkdir -p .runtime/ci-evidence
          docker compose logs --no-color > .runtime/ci-evidence/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-compose-evidence
          path: |
            .runtime/ci-evidence/
            docs/screenshots/states/
          retention-days: 14
      - name: Stop disposable services, preserving volumes for runner lifetime
        if: always()
        run: docker compose down
