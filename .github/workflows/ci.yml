name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python -m alembic upgrade head
      - run: docker build -t incidentops-api .
      - name: Audit the Python packages actually installed in the API image
        run: |
          mkdir -p .runtime/ci-evidence
          docker run --rm --entrypoint python incidentops-api -m pip freeze --exclude incidentops > .runtime/ci-evidence/python-runtime.txt
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r .runtime/ci-evidence/python-runtime.txt --no-deps --disable-pip --format json --output .runtime/ci-evidence/python-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-runtime-audit
          path: .runtime/ci-evidence/
          retention-days: 14
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: docker build -t incidentops-web .

  postgres-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: incidentops-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PASSWORD: synthetic-ci-only-password
      APP_ENV: development
      APP_ORIGIN: http://localhost:8080
      TEST_DATABASE_URL: postgresql+psycopg://incidentops:synthetic-ci-only-password@127.0.0.1:5432/incidentops
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,browser]'
      - name: Build and start a fresh PostgreSQL stack
        run: docker compose -f compose.yaml -f compose.test.yaml up --build --wait --wait-timeout 180
      - name: Verify migration revision and explicit synthetic seed
        run: |
          docker compose exec -T api python -m alembic current
          docker compose exec -T api python -m incidentops.manage demo
      - name: Run existing API suite against isolated PostgreSQL schemas
        run: python -m pytest -q
      - name: Exercise the actual HTTP stack
        run: python scripts/compose_smoke.py before
      - name: Restart containers and prove persistence
        run: |
          docker compose restart db
          docker compose -f compose.yaml -f compose.test.yaml up --wait --wait-timeout 180
          docker compose restart api web
          python scripts/compose_smoke.py after
      - name: Exercise database backup and restoration into a separate database
        run: |
          docker compose exec -T db pg_dump -U incidentops -d incidentops -Fc -f /tmp/incidentops.dump
          docker compose exec -T db createdb -U incidentops incidentops_restore_test
          docker compose exec -T db pg_restore -U incidentops --no-owner -d incidentops_restore_test /tmp/incidentops.dump
          original=$(docker compose exec -T db psql -U incidentops -d incidentops -Atc 'SELECT count(*) FROM incidents')
          restored=$(docker compose exec -T db psql -U incidentops -d incidentops_restore_test -Atc 'SELECT count(*) FROM incidents')
          test "$original" = "$restored"
          docker compose exec -T db psql -U incidentops -d incidentops_restore_test -Atc 'SELECT version_num FROM alembic_version'
      - name: Browser walkthrough of the container-served frontend
        env:
          INCIDENTOPS_URL: http://localhost:8080
        run: |
          python -m playwright install --with-deps chromium
          python tests/browser_smoke.py
      - name: Capture required viewports from the PostgreSQL application
        env:
          INCIDENTOPS_URL: http://localhost:8080
        run: python scripts/capture_screens.py
      - name: Scan exact runtime images without mounting the Docker socket
        run: |
          mkdir -p .runtime/image-scan .runtime/ci-evidence .runtime/trivy-cache
          docker image inspect "${COMPOSE_PROJECT_NAME}-api" "${COMPOSE_PROJECT_NAME}-web" "${COMPOSE_PROJECT_NAME}-db" --format '{{json .RepoDigests}} {{.Id}}' > .runtime/ci-evidence/image-digests.txt
          for image in api web db; do
            case "$image" in
              api) source="${COMPOSE_PROJECT_NAME}-api" ;;
              web) source="${COMPOSE_PROJECT_NAME}-web" ;;
              db) source="${COMPOSE_PROJECT_NAME}-db" ;;
            esac
            docker save "$source" -o ".runtime/image-scan/${image}.tar"
            docker run --rm \
              -v "$PWD/.runtime/image-scan:/scan:ro" \
              -v "$PWD/.runtime/ci-evidence:/report" \
              -v "$PWD/.runtime/trivy-cache:/cache" \
              aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 \
              image --cache-dir /cache --scanners vuln --severity HIGH,CRITICAL --format json \
              --output "/report/${image}-vulnerabilities.json" --input "/scan/${image}.tar"
          done
          python scripts/check_container_reports.py .runtime/ci-evidence/*-vulnerabilities.json
      - name: Retain container logs
        if: always()
        run: |
          mkdir -p .runtime/ci-evidence
          docker compose logs --no-color > .runtime/ci-evidence/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-compose-evidence
          path: |
            .runtime/ci-evidence/
            docs/screenshots/states/
            docs/screenshots/after/
          retention-days: 14
      - name: Stop disposable services, preserving volumes for runner lifetime
        if: always()
        run: docker compose down
