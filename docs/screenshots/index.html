<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IncidentOps — Before & after</title><style>body{font:14px/1.5 system-ui;margin:0;background:#f6f8fa;color:#1e2932}header{padding:24px 32px;background:white;border-bottom:1px solid #dce2e7}h1{margin:0 0 8px;font-size:24px}p{margin:0;color:#5c6873}nav{display:flex;gap:16px;flex-wrap:wrap;margin-top:20px}label{display:grid;gap:4px}select{font:inherit;padding:8px;border:1px solid #7e8d98;border-radius:4px;background:white}main{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:24px}figure{margin:0;min-width:0}figcaption{font-weight:600;margin-bottom:12px}img{width:100%;height:auto;border:1px solid #dce2e7;background:white}a{color:#315b69}small{color:#5c6873} @media(max-width:800px){main{grid-template-columns:1fr}header{padding:20px}main{padding:16px}}</style><header><h1>IncidentOps — Before & after</h1><p>Actual Chromium captures. Approved operations workbench redesign. No image retouching.</p><nav><label>Screen<select id="screen"><option value="dashboard">Security overview</option><option value="incidents">Incident queue</option><option value="detail">Investigation</option><option value="analyzer">Login analyzer</option><option value="team">Team & permissions</option><option value="login">Authentication</option></select></label><label>Viewport<select id="size"><option value="desktop">Desktop · 1440 × 900</option><option value="laptop">Laptop · 1280 × 800</option><option value="mobile">Mobile · 390 × 844</option></select></label></nav><p style="margin-top:16px"><small>After captures include synthetic cases created by functional tests. Counts may differ. Open an image to inspect it at full resolution.</small></p></header><main><figure><figcaption>Before</figcaption><a id="before-link"><img id="before" alt="Original IncidentOps screen"></a></figure><figure><figcaption>After</figcaption><a id="after-link"><img id="after" alt="Redesigned IncidentOps screen"></a></figure></main><script>const screen=document.getElementById('screen'),size=document.getElementById('size');function update(){const value=screen.value,v=size.value;for(const stage of ['before','after']){const name=stage==='after'&&value==='detail'?'incident-1':value;const path=stage+'/'+name+'-'+v+'.png';document.getElementById(stage).src=path;document.getElementById(stage+'-link').href=path;}}screen.addEventListener('change',update);size.addEventListener('change',update);update();</script></html>
